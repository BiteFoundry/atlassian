[package]
name = "atlassian-cli"
version = "0.8.8"
edition = "2021"
description = "Unified Atlassian Jira & Confluence native terminal client & AI agent toolkit (CLI, TUI, HTTP API, MCP)"
license = "MIT"

[lib]
name = "atlassian_cli"
path = "src/lib.rs"

[[bin]]
name = "atlassian"
path = "src/main.rs"

[features]
default = ["html-js", "svg-graphics", "desktop-notify"]
html-js = ["bitefoundry-html/js"]
svg-graphics = ["bitefoundry-html/graphics"]
desktop-notify = ["dep:notify-rust"]

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["image-data"] }
axum = "0.8"
base64 = "0.22"
bitefoundry-html = { git = "https://github.com/BiteFoundry/bitefoundry-html", rev = "72273560cd5b689e66d37c81fc957e422855842d", default-features = false, features = ["serve"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
notify-rust = { version = "4", optional = true }
open = "5"
rand = "0.8"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "rustls-tls-native-roots"] }
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
unicode-width = "0.2"
url = "2"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
